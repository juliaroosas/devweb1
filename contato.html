<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width-device-width initial-scale=1.0">

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

</head>

<body>
    <header>

        <hr class="border-none h-2 bg-blue-800 mt-6 mb-2">
        <div class="flex justify-between items-center max-w-[90%] mx-auto">
        
        <img src="logo.png" alt="logo">

        <nav class="navbar navbar-expand-sm bg-light">

            <div class="container-fluid">
              
              <ul class="navbar-nav">
                <li class="nav-item">
                    <a href="index.html" style="color: darkblue;">Home</a> | 
                </li>
                <li class="nav-item">
                    <a href="quemsomos.html" style="color: darkblue;">Quem Somos</a> |
                </li>
                <li class="nav-item">
                    <a href="contato.html" style="color: purple">Contato</a>
                </li>
              </ul>
            </div>
        <nav>
    </header>

    <section class="p-3">
        <h1 class="text-3xl font-bold text-gray-700 mt-4 mb-4">Entre em contato</h1>
            <p class="mb-4">Lorem ipsum dolor sit amet consectetur adipisicing elit.</p>
        
        <div class="form-group">
            <label for="email">E-mail</label>
                <input type="email" class="form-control" id="email" placeholder="Digite seu e-mail" required>
        </div>
        <div class="form-group">
            <label for="assunto">Assunto</label>
                <input type="text" class="form-control" id="assunto" placeholder="Digite o assunto" required>
        </div>
        <div class="form-group">
            <label for="mensagem">Mensagem</label>
            <textarea class="form-control" id="mensagem" rows="4" placeholder="Digite sua mensagem" required></textarea>
        </div>
        
        <button type="submit" class="btn btn-primary">Enviar</button>
        
        </div>
    </section>

    <footer class="text-center text-white mt-4 mb-3 bg-blue-800">
        <h5>Todos os direitos reservados.</h5>
    </footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
